<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121;">
    0	UNSENT	            Client has been created. open() not called yet.
    1	OPENED	            open() has been called.
    2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
    3	LOADING	            Downloading; responseText holds partial data.
    4	DONE	            The operation is complete.
</body>
<script>
    const requestUrl = 'https://api.github.com/users/hiteshchoudhary'  // it contains some api requests
    const xhr = new XMLHttpRequest();  // this XMLHttpRequest is a class and we have created an object/inference called xhr out of it
    xhr.open('GET', requestUrl)
    xhr.onreadystatechange = function(){        // this onreadystatechange is kind of an event listener
        console.log(xhr.readyState)
        if (xhr.readyState==4){
            let data = this.responseText  // responseText is a property of the class XMLHttpRequest
            console.log(typeof(data)) // note-> jab bhi url se data aata ha, to wo mostly string form me hi aata ha, humme usko object/json me convert krna padta ha
            data = JSON.parse(data)
            console.log(typeof(data)) // now this is object datatype
            console.log(data.followers)
            console.log(data)

        }
    }

    xhr.send();
</script>
</html>
