// NOTE -> in event listeners we have a third parameter of true or false which is false as defualt. this is called event propagation. it decides the flow/order of events to be followed (i.e from inner to outer or outer to inner) . in case of false -> it is called event bubbling which executed the events from inner child to outer parents. like if there are two event listeners on an element with one being on the inner child element and other being on the outer parent of the child, then in case of false, the inner child event will execute first . In case of true -> it is called event capturing and it works from outer parent to inner child

    document.querySelector('#images').addEventListener('click', function(e){
        console.log(e.target.tagName);
        if (e.target.tagName === 'IMG') {
            console.log(e.target.id);
            let removeIt = e.target.parentNode
            removeIt.remove()
        }
    
        
    })
